# render.yaml: settings Render reads when you create the site as a "Blueprint".
# It runs the same web server you use on your PC (wow-items-mcp/web.js).
services:
  - type: web
    name: wow-gear-sim
    runtime: node
    plan: free
    rootDir: wow-gear-sim       # on GitHub, the files are inside a "wow-gear-sim" folder
    buildCommand: npm install   # nothing to install (no packages), but Render expects a build step
    startCommand: npm start     # runs: node wow-items-mcp/web.js
    healthCheckPath: /
